
name: Build and deploy Frontend to Azure - qltc-frontend-bao

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/main_qltc-frontend-bao.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies and build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          test -f out/index.html

      - name: Package static website
        run: |
          cd frontend/out
          zip -qr ../../frontend-release.zip .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release
          path: frontend-release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-release

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0186A33091564D888ECCAB0D23BF5E64 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_52DEB33B2D41434788ACCF2BB5B75D86 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D28B7F6CB7E94648985B3A1E69955D0F }}

      - name: Deploy Frontend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'qltc-frontend-bao'
          slot-name: 'Production'
          package: 'frontend-release.zip'
